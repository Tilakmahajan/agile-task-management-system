                                                                                                                                                                                                          <div class="auth-bg flex items-center justify-center relative">
                                                                                                                                                                                                            
  <!-- Back Button (Floating top left) -->
  <div class="absolute top-6 left-6 z-20">
    <a routerLink="/board" class="text-gray-600 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-white/50 group flex items-center justify-center" aria-label="Back to Board">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </a>
  </div>

  <div class="auth-card">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Edit Profile</h1>
      <p class="text-gray-500">Update your account details</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div>
        <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
        <input 
          type="text" 
          id="displayName" 
          formControlName="displayName"
          class="auth-input"
          placeholder="Your name"
        />
      </div>

      <!-- Read-only email display -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <div class="auth-input bg-gray-50 text-gray-500 cursor-not-allowed flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
          </svg>
          <span class="truncate text-sm">{{ userEmail || 'Loading...' }}</span>
        </div>
        <p class="text-gray-400 text-xs mt-1">Email cannot be changed here.</p>
      </div>

      <div>
        <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1">
          Current Password <span class="text-xs text-gray-400 font-normal ml-1">(Required to change password)</span>
        </label>
        <div class="relative">
          <input 
            [type]="showCurrentPassword ? 'text' : 'password'" 
            id="currentPassword" 
            formControlName="currentPassword"
            class="auth-input pr-10"
            [class.border-red-500]="profileForm.errors?.['currentPasswordRequired'] && (profileForm.get('currentPassword')?.touched || profileForm.get('newPassword')?.touched)"
            [class.focus-ring-red]="profileForm.errors?.['currentPasswordRequired'] && (profileForm.get('currentPassword')?.touched || profileForm.get('newPassword')?.touched)"
            placeholder="••••••••"
          />
          <button type="button" (click)="showCurrentPassword = !showCurrentPassword"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-indigo-600 transition-colors"
            [attr.aria-label]="showCurrentPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
        <p *ngIf="profileForm.errors?.['currentPasswordRequired'] && (profileForm.get('currentPassword')?.touched || profileForm.get('newPassword')?.touched)" class="text-red-500 text-xs mt-1">
          Please enter your current password to set a new one
        </p>
      </div>

      <div>
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">
          New Password <span class="text-xs text-gray-400 font-normal ml-1">(Leave blank to keep current)</span>
        </label>
        <div class="relative">
          <input 
            [type]="showNewPassword ? 'text' : 'password'" 
            id="newPassword" 
            formControlName="newPassword"
            class="auth-input pr-10"
            placeholder="••••••••"
          />
          <button type="button" (click)="showNewPassword = !showNewPassword"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-indigo-600 transition-colors"
            [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <div [class.opacity-50]="!profileForm.get('newPassword')?.value" [class.pointer-events-none]="!profileForm.get('newPassword')?.value">
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
        <div class="relative">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            id="confirmPassword" 
            formControlName="confirmPassword"
            class="auth-input pr-10"
            [class.border-red-500]="profileForm.errors?.['passwordMismatch'] && profileForm.get('confirmPassword')?.touched"
            [class.focus-ring-red]="profileForm.errors?.['passwordMismatch'] && profileForm.get('confirmPassword')?.touched"
            placeholder="••••••••"
          />
          <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-indigo-600 transition-colors"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
        <p *ngIf="profileForm.errors?.['passwordMismatch'] && profileForm.get('confirmPassword')?.touched" class="text-red-500 text-xs mt-1">
          Passwords do not match
        </p>
      </div>


      <div class="pt-2">
        <button type="submit" class="auth-btn w-full gap-2" [disabled]="isLoading || (profileForm.pristine || profileForm.invalid)">
          <span *ngIf="!isLoading">Save Changes</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
