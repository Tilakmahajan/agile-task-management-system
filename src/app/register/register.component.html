<div class="auth-bg flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
  <div class="auth-card">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
      <p class="text-gray-500">Join Agile Task Management today</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName"
          [(ngModel)]="fullName" 
          required
          class="auth-input"
          [class.border-red-500]="fullNameError"
          placeholder="John Doe"
        />
        <p *ngIf="fullNameError" class="text-red-500 text-xs mt-1">{{ fullNameError }}</p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="email" 
          required
          class="auth-input"
          [class.border-red-500]="emailError"
          placeholder="you@example.com"
        />
        <p *ngIf="emailError" class="text-red-500 text-xs mt-1">{{ emailError }}</p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="password" 
          required
          class="auth-input"
          [class.border-red-500]="passwordError"
          placeholder="••••••••"
        />
        <p *ngIf="passwordError" class="text-red-500 text-xs mt-1">{{ passwordError }}</p>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword"
          [(ngModel)]="confirmPassword" 
          required
          class="auth-input"
          [class.border-red-500]="confirmPasswordError"
          placeholder="••••••••"
        />
        <p *ngIf="confirmPasswordError" class="text-red-500 text-xs mt-1">{{ confirmPasswordError }}</p>
      </div>

      <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm">
        {{ errorMsg }}
      </div>

      <div>
        <button type="submit" class="auth-btn w-full mt-2" [disabled]="isLoading">
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading">Creating Account...</span>
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Already have an account? 
      <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500">
        Sign in
      </a>
    </div>
  </div>

  <!-- Loading overlay while creating account -->
  <div *ngIf="isLoading" class="auth-loading-overlay">
    <div class="auth-loading-card">
      <div class="auth-loading-spinner" aria-hidden="true"></div>
      <p class="auth-loading-text">Creating your account...</p>
    </div>
  </div>
</div>
