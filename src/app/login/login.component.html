<div class="auth-bg flex items-center justify-center">
  <div class="auth-card">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
      <p class="text-gray-500">Sign in to continue to Agile Task Management</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="email" 
          required
          class="auth-input"
          [class.border-red-500]="emailError"
          [class.focus-ring-red]="emailError"
          placeholder="you@example.com"
        />
        <p *ngIf="emailError" class="text-red-500 text-xs mt-1">{{ emailError }}</p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="password" 
          required
          class="auth-input"
          [class.border-red-500]="passwordError"
          [class.focus-ring-red]="passwordError"
          placeholder="••••••••"
        />
        <p *ngIf="passwordError" class="text-red-500 text-xs mt-1">{{ passwordError }}</p>
      </div>

      <div *ngIf="errorMsg" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm">
        {{ errorMsg }}
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Remember me
          </label>
        </div>

        <div class="text-sm">
          <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">
            Forgot your password?
          </a>
        </div>
      </div>

      <div>
        <button type="submit" class="auth-btn w-full" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing in...</span>
        </button>
      </div>
    </form>

    <div class="mt-6 text-center text-sm text-gray-600">
      Don't have an account? 
      <a routerLink="/register" class="font-medium text-indigo-600 hover:text-indigo-500">
        Sign up
      </a>
    </div>
  </div>
</div>
